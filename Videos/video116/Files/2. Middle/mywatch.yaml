###########################################
# Text Sensors for Voice Assistant
##########################################
text_sensor:
  - id: text_request
    platform: template
    on_value:
      - lambda: |-
          if(id(text_request).state.length()>32) {
          std::string name = id(text_request).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_request).state = (truncated+"...").c_str();
          }
      - lvgl.label.update:
          id: ui_lbl_request
          text:
            format: "%s"
            args: [ 'id(text_request).state.c_str()' ]

  - id: text_response
    platform: template
    on_value:
      - lambda: |-
          if(id(text_response).state.length()>32) {
          std::string name = id(text_response).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_response).state = (truncated+"...").c_str();
          }

#############################################################
#  Text object for Voice ToDo Custom Command and LVGL Widget
############################################################
text:
  - platform: template
    id: work_text
    name: "Work Text"
    mode: TEXT
    restore_value: false
    initial_value: ""
    optimistic: true
    # When HA sets a new value , update the LVGL label
    on_value:
      then:
        - lvgl.label.update: 
            id: ui_work_label
            text: !lambda |-
              return id(work_text).state.c_str();
        - lambda: |-
            std::string text_str = id(work_text).state;
            int lines = 1;
            if (text_str.empty() ) {
                lines = 0;
            } else {
                for (char c : text_str) {
                  if (c == '\n') lines++;
                }
            }
            id(item_count) = lines;   //update the global
        - lvgl.label.update:
            id: ui_lbl_list
            text:
              format: "items: %d"
              args: [ 'id(item_count)']

#### SCRIPTS ############################################################
#########################################################################
script:
  ####  Media Player Volume Update
  ####################################
  - id: lw_ui_slider_spk_drives
    then:
      - media_player.volume_set: 
          id: mywatch_media_player
          volume: !lambda 'return (float)lv_slider_get_value(id(ui_slider_spk)) / 100.0;'
      #### Only update the slider's label when the slider's value changes
      ###################################################################
      - if:
          condition:
            lambda: !lambda |-
              char buf[50];
              snprintf(buf, sizeof(buf), "%d", (int)(lv_slider_get_value(id(ui_slider_spk))));
              return std::string(buf) != lv_label_get_text(id(ui_lbl_value));
          then:
            - lvgl.label.update:
                id: ui_lbl_value
                text: !lambda |-
                  char buf[50];
                  snprintf(buf, sizeof(buf), "%d", (int)(lv_slider_get_value(id(ui_slider_spk))));
                  return std::string(buf);


    #### WAKE Button press action
    ##############################################
  - id: enable_wake
    then:
      #### User did not wait for assistant.
      - if:
          condition: micro_wake_word.is_running
          then:
            - micro_wake_word.stop:
            - voice_assistant.stop: 
            - lvgl.label.update: 
                id: ui_lbl_flag
                text: "\uF011"
                text_color: 0xD30000
            - lvgl.animation.stop: orb_pulse
            - lvgl.obj.update: 
                id: ui_orb
                bg_color: 0x000000
                shadow_color: 0xADADAD
            - lvgl.label.update: 
                id: ui_lbl_listen
                text: "Error"
          #### Used pressed WAKE button and device begins to listen
          #############################################################
          else:
            - micro_wake_word.start:
            - lvgl.label.update: 
                id: ui_lbl_flag
                text: "\uF011"
                text_color: 0x3BB143 

     #### User pressed SEND.  Sets trigger for Automation to perform notice
     #######################################################################
  - id: send_notice
    then:
      - binary_sensor.template.publish:
          id: send_trigger_sensor
          state: true

    #### Count people with checked boxes
    ########################################
  - id: update_people_count
    then:
      - lambda: |-
          int count = 0;
          // Check the state of each checkbox
          if (lv_obj_has_state(id(ui_cb1), LV_STATE_CHECKED)) count++;
          if (lv_obj_has_state(id(ui_cb2), LV_STATE_CHECKED)) count++;
          if (lv_obj_has_state(id(ui_cb3), LV_STATE_CHECKED)) count++;
          if (lv_obj_has_state(id(ui_cb4), LV_STATE_CHECKED)) count++;
          
          // Update the global variable
          id(people_count) = count;
      - lvgl.label.update:
          id: ui_lbl_people
          text:
            format: "Count: %d"
            args: [id(people_count)]

