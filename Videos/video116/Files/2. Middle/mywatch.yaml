esphome:
  name: mywatch
  friendly_name: MyWatch
  on_boot:
    then:
      - delay: 5sec
        #### Pick a person(s) to receive a list notification
        #########################################################
      - switch.turn_on: 
          id: switch_$name_1
        ##########################################################
      - script.execute: update_people_count
        
esp32:
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz
  
logger:
  level: INFO

api:
  encryption:
    key: !secret mywatch_api

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret mywatch_ap_ssid
    password: !secret  mywatch_ap_pwd
  #use_address: 192.168.68.130
  manual_ip: 
    static_ip: 192.168.68.130
    gateway: 192.168.68.1
    subnet: 255.255.255.0
    
web_server:
  
captive_portal:

#### Substitutions
############################################################

substitutions:
  #### Define your names of people to recive notifications
  #########################################################
  name_1: "Alice"
  name_2: "Bob"
  name_3: "Charlie"
  name_4: "Diana"
  ###########################################################
globals:
  - id: item_count
    type: int
    initial_value: '0'
  - id: people_count
    type: int
    initial_value: '0'
  - id: help_msg
    type: std::string
    initial_value: '"Press WAKE. Say: Okay Nabu. Wait for Listening. Ask: What time is it?"'


#### Hardware definitions  
############################################################

spi:
  - id: spi_display
    type: quad
    clk_pin: 11
    data_pins:
      - 4
      - 5
      - 6
      - 7

i2c:
  - id: bus_i2c_gpio_15_14
    sda: 15
    scl: 14
    frequency: 400kHz
    scan: true

display:
  - id: panel
    platform: mipi_spi
    model: CO5300
    bus_mode: quad
    spi_id: spi_display
    cs_pin: 12
    reset_pin: 8
    dimensions:
      width: 410
      height: 502
      offset_width: 22
      offset_height: 0
      pad_width: 48
      pad_height: 0
    color_order: rgb
    data_rate: 40MHz
    auto_clear_enabled: false

touchscreen:
  - id: touch
    platform: ft63x6
    display: panel
    i2c_id: bus_i2c_gpio_15_14
    interrupt_pin: 38
    reset_pin: 9
    address: 0x38
    on_touch: 
    - light.turn_on: 
        id: backlight
        brightness: 100%
    on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
                
binary_sensor:
  - platform: status
    name: "Status"
    id: my_status 
    internal: false
  - platform: gpio
    id: dio_bootbutton
    name: "BOOTButton"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
      inverted: true
    internal: true
    filters:
      - delayed_on_off: 25ms
  - platform: gpio
    id: dio_pwrbutton
    name: "PWRButton"
    pin:
      number: 10
      mode:
        input: true
    internal: true
    filters:
      - delayed_on_off: 25ms

  - platform: template
    name: "Send Trigger"
    id: send_trigger_sensor
    lambda: |-
      return false;
    # Keeps the sensor 'on' for 1 second before resetting
    filters:
      - delayed_off: 1s 

        
output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: !lambda 'id(panel).set_brightness((uint8_t) lroundf(state * 255.0f));'

light:
  - platform: monochromatic
    id: backlight
    name: "MyWatch Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON

