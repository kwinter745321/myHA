#### Audio definitions
#####################################
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_i2c_gpio_15_14
    address: 0x40 
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 30 

i2s_audio:
  - id: i2s_output  #spk  
    i2s_bclk_pin: GPIO41
    i2s_mclk_pin: GPIO16
    i2s_lrclk_pin: 
      number: GPIO45
      ignore_strapping_warning: true 
      
microphone:
  - platform: i2s_audio
    id: es7210_mic
    i2s_audio_id: i2s_output
    sample_rate: 16000
    i2s_din_pin: GPIO42
    bits_per_sample: 16bit
    adc_type: external

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_i2c_gpio_15_14
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000

speaker:
  - platform: i2s_audio
    id: speaker_id
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO40
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    
micro_wake_word:
  id: wake_word
  models:
    - model: okay_nabu
      id: nodel_nabu
    # - hey_jarvis
    # - alexa
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    
media_player:
  - platform: speaker
    name: "MyWatch Media Player"
    id: mywatch_media_player
    volume_initial: 60%
    volume_min: 10%
    volume_max: 70%
    volume_increment: 10%
    media_pipeline:
        speaker: media_spk_resampling_input
        num_channels: 1
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    on_play:
      then:
        - micro_wake_word.stop: 
        - delay: 200ms
    # on_idle:
    #   then:
    #     - audio_dac.set_volume: !lambda 'return (float)lv_slider_get_value(id(ui_slider_spk)) / 100.0;'


switch:
  - platform: gpio
    pin: 
      number: GPIO46 # Use the pin connected to Mic VCC/Enable
      ignore_strapping_warning: true
    name: "Microphone Power"
    id: mic_power_switch
    restore_mode: ALWAYS_ON
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Recipient $name_1"
    id: switch_$name_1
    optimistic: true
    on_turn_on:
      - lvgl.widget.update:
          id: ui_cb1
          state:
            checked: true
      - script.execute: update_people_count
    on_turn_off:
      - lvgl.widget.update:
          id: ui_cb1
          state:
            checked: false
      - script.execute: update_people_count

  - platform: template
    name: "Recipient $name_2"
    id: switch_$name_2
    optimistic: true
    on_turn_on:
      - lvgl.widget.update:
          id: ui_cb2
          state:
            checked: true
      - script.execute: update_people_count
    on_turn_off:
      - lvgl.widget.update:
          id: ui_cb2
          state:
            checked: false
      - script.execute: update_people_count

  - platform: template
    name: "Recipient $name_3"
    id: switch_$name_3
    optimistic: true
    on_turn_on:
      - lvgl.widget.update:
          id: ui_cb3
          state:
            checked: true
      - script.execute: update_people_count
    on_turn_off:
      - lvgl.widget.update:
          id: ui_cb3
          state:
            checked: false
      - script.execute: update_people_count

  - platform: template
    name: "Recipient $name_4"
    id: switch_$name_4
    optimistic: true
    on_turn_on:
      - lvgl.widget.update:
          id: ui_cb4
          state:
            checked: true
      - script.execute: update_people_count
    on_turn_off:
      - lvgl.widget.update:
          id: ui_cb4
          state:
            checked: false
      - script.execute: update_people_count
        
#### Voice Assistant ########################################
voice_assistant:
  microphone: es7210_mic
  media_player: mywatch_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 3.5
  on_idle:
    - lvgl.label.update: 
          id: ui_lbl_listen
          text: "Idle"
    - lvgl.obj.update: 
        id: ui_orb
        bg_color: 0xC0C0C0
        shadow_color: 0xC0C0C0
  on_listening:
    # - logger.log: "VA: listening for command"
    - lvgl.label.update: 
          id: ui_lbl_listen
          text: "Listening"
    - lvgl.animation.start: orb_pulse
    - lvgl.obj.update: 
        id: ui_orb
        bg_color: 0x3B8143
        shadow_color: 0x3B8143
  on_stt_vad_start:
    - lvgl.label.update: 
        id: ui_lbl_listen
        text: "Thinking"
    - lvgl.obj.update: 
        id: ui_orb
        bg_color: 0xFFBD00
        shadow_color: 0xFFBD00
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - lvgl.obj.update: 
        id: ui_orb
        bg_color: 0xFFBD00
        shadow_color: 0xFFBD00
    - lvgl.label.update: 
        id: ui_lbl_listen
        text: "Thinking"
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lvgl.obj.update: 
        id: ui_orb
        bg_color: 0xFF0000
        shadow_color: 0xFF0000
    - lvgl.label.update: 
        id: ui_lbl_listen
        text: "Reply"
  on_tts_end:
    then:
      - delay: 1s
      - lvgl.animation.stop: orb_pulse
  on_end:
    # Wait until announcement playback has finished
    - delay: 2s
    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: speaker_id
        timeout: 15s
    # Restart wake word only if it is not already running
    - if:
        condition:
          - not:
              micro_wake_word.is_running
        then:
          - lvgl.label.update: 
              id: ui_lbl_listen
              text: "Idle"
          - lvgl.obj.update: 
              id: ui_orb
              bg_color: 0xC0C0C0
              shadow_color: 0xADADAD
          - lvgl.label.update: 
              id: ui_lbl_flag
              text: "\uF011"
              text_color: 0xD30000
          - lvgl.label.update: 
              id: ui_lbl_request
              text: !lambda |-
                      return id(text_response).state.c_str();
  on_error:
    then:
      - lvgl.label.update: 
            id: ui_lbl_listen
            text: "Error"
      - wait_until: 
          - not:
              media_player.is_announcing:

################################################################
time:
  - platform: homeassistant
    id: homeassistant_time

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: ui_lbl_time
          text:
            time_format: "%H:%M:%S"
            time: homeassistant_time
    
number:
  - platform: template
    name: "Speaker Volume Control"
    id: speaker_volume_control
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60
    on_value:
      then:
        # This action handles the conversion from 0-100 (slider) to 0.0-1.0 (media player)
        - media_player.volume_set:
            id: mywatch_media_player
            volume: !lambda 'return x / 100.0;'

  - platform: template
    name: "Mic Gain Control"
    id: mic_gain_control
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60

######################################################################################
#### https://github.com/cptkirki/AXP2101_WS-AMOLED-1.75
####
#### Used to interface to the AXP2101 power management chip to learn the battery level
######################################################################################
external_components:
  - source:
      type: git
      url: https://github.com/cptkirki/AXP2101_WS-AMOLED-1.75
      ref: v1.0.0
    components: [axp2101]

axp2101:
  id: axp2101_component
  model: WS-S3AMOLED175
  address: 0x34
  i2c_id: bus_i2c_gpio_15_14
  update_interval: 60s
    
sensor:
  - platform: axp2101
    # battery_voltage:
    #   name: "Battery Voltage"
    #   unit_of_measurement: "v"
    battery_level:
      name: "Battery Level"
      id: battery_level
      unit_of_measurement: "%"
      on_value:
        then:
          - lvgl.label.update: 
              id: ui_lbl_battery
              text:
                format: "Battery: %3.0f%%"
                args: [ 'id(battery_level).state']
    battery_charging:
      name: "Battery Charging"
