################################################################################################
################################################################################################

#### Note animations is defined within LVGL
############################################
  animations:
    - id: orb_pulse
      duration: 1.5s        # Time taken for a full pulse cycle (fade in + fade out)
      auto_start: false      # Automatically begin pulsing on boot
      loop: true            # Continually repeat the animation
      timing:
        - type: round_trip  # Reverses direction halfway through the duration
        - type: ease_in_out # Smooths out the transition at the peaks and valleys
      widgets:
        - id: ui_orb
          opa:
            from: 50%        # Dim state (minimum brightness)
            to: 100%         # Bright state (maximum brightness)


