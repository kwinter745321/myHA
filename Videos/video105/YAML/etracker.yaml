# Installation method: Home Assistant OS
# Core: 2026.8.3
# Supervisor: 2026.08.0
# Operating System: 18.2
# Frontend: 20260729.7
# ESPHome Current version: 2026.8.2
#
# Board: ESP32-S3 16MB QIO, 8MB OPI PSRAM
# Definition: definitions/boards/esp32s3_120_16_8-qio_opi/manifest.yaml

esphome:
  name: etracker
  friendly_name: etracker

esp32:
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio

psram:
  mode: octal

logger:
  level: DEBUG

api:
  encryption:
    key: !secret etracker_api
    
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.68.125
    gateway: 192.168.68.1
    subnet: 255.255.255.0
  ap:
    ssid: !secret etracker_ap_ssid
    password: !secret etracker_ap_pwd

web_server:
    
captive_portal:
  
##################################################################
globals:
  id: scanning_active
  type: bool
  restore_value: false
  initial_value: 'false'


script:
  - id: parse_text
    mode: single
    parameters:
      raw: string
    then:
      - if:
          condition:
            lambda: 'return id(scanning_active);'
          then:
            - lambda: |-
                std::string raw_text = raw.c_str();  
                //  FOR EXAMPLE:  {"timestamp":228,"address":"46:31:74:7E:7F:B6","rssi":-97,"name":""}
                
                // 1. Extract MAC Address
                std::string mac_address = "";
                size_t addr_start = raw_text.find("\"address\":\"");
                if (addr_start != std::string::npos) {
                    addr_start += 11;
                    size_t addr_end = raw_text.find("\"", addr_start);
                    mac_address = raw_text.substr(addr_start, addr_end - addr_start);
                    std::replace(mac_address.begin(), mac_address.end(), '6', '4');
                }
      
                // 2. Extract RSSI
                int rssi = -100;
                size_t rssi_start = raw_text.find("\"rssi\":");
                if (rssi_start != std::string::npos) {
                    rssi_start += 7;
                    size_t rssi_end = raw_text.find_first_of(",}", rssi_start);
                    std::string rssi_str = raw_text.substr(rssi_start, rssi_end - rssi_start);
                    rssi = esphome::parse_number<int>(rssi_str).value_or(-100);
                }
      
                // 3. Extract Name
                std::string device_name = "Unknown";
                size_t name_start = raw_text.find("\"name\":\"");
                if (name_start != std::string::npos) {
                    name_start += 8; // Move past "name":"
                    size_t name_end = raw_text.find("\"", name_start);
                    device_name = raw_text.substr(name_start, name_end - name_start);
                    
                    // If name is empty string "", use "Unknown"
                    if (device_name == "") device_name = "Unknown";
                }
      
                // 4. Validation
                if (mac_address.empty() || rssi <= -95) {
                  return;
                }
      
                // 5. UI Logic
                static std::map<std::string, lv_obj_t*> device_map;
                lv_obj_t * container = id(ble_container);
                if (container == nullptr) return;
      
                if (device_map.count(mac_address)) {
                  // A. UPDATE EXISTING ROW
                  lv_obj_t * existing_row = device_map[mac_address];
                  
                  // Find the RSSI label (it's the 3rd child in our new 3-child layout)
                  // Child 0: MAC, Child 1: Name, Child 2: RSSI
                  lv_obj_t * rssi_label = lv_obj_get_child(existing_row, 2); 
                  std::string r_text = std::to_string(rssi) + " dBm";
                  lv_label_set_text(rssi_label, r_text.c_str());
                  
                  if (rssi < -85) lv_obj_set_style_text_color(rssi_label, lv_palette_main(LV_PALETTE_RED), 0);
                  else lv_obj_set_style_text_color(rssi_label, lv_palette_main(LV_PALETTE_GREEN), 0);
                  
                } else {
                  // B. CREATE NEW ROW
                  lv_obj_t * row = lv_obj_create(container);
                  
                  // Setup Row Flexbox (3 Columns)
                  lv_obj_set_size(row, 364, 35); // Slightly taller for 3 columns
                  lv_obj_set_flex_flow(row, LV_FLEX_FLOW_ROW);
                  // Space between the 3 elements
                  lv_obj_set_flex_align(row, LV_FLEX_ALIGN_SPACE_BETWEEN, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER);
                  
                  lv_obj_set_style_border_width(row, 0, 0);
                  lv_obj_set_style_bg_opa(row, 0, 0);
                  lv_obj_set_style_pad_all(row, 5, 0);
      
                  lv_obj_t * mac_label = lv_label_create(row);
                  lv_label_set_text(mac_label, mac_address.c_str());
                  // Make MAC slightly smaller/grey so it doesn't crowd the name
                  lv_obj_set_style_text_color(mac_label, lv_palette_main(LV_PALETTE_BLUE), 0);
      
                  lv_obj_t * name_label = lv_label_create(row);
                  std::string dev_short = device_name.substr(0,10);
                  lv_label_set_text(name_label, dev_short.c_str());
                  lv_obj_set_style_text_color(name_label, lv_palette_main(LV_PALETTE_PURPLE), 0);
      
                  lv_obj_t * rssi_label = lv_label_create(row);
                  std::string r_text = std::to_string(rssi) + " dBm";
                  lv_label_set_text(rssi_label, r_text.c_str());
                  
                  // Divider line
                  lv_obj_set_style_border_side(row, LV_BORDER_SIDE_BOTTOM, 0);
                  lv_obj_set_style_border_width(row, 1, 0);
                  lv_obj_set_style_border_color(row, lv_palette_main(LV_PALETTE_GREY), 0);
                  lv_obj_set_style_border_opa(row, LV_OPA_30, 0);
      
                  device_map[mac_address] = row;
      
                  if (device_map.size() > 15) {
                      auto it = device_map.begin();
                      lv_obj_del(it->second);
                      device_map.erase(it);
                  }
                }

 


##################################################################

esp32_ble_tracker:
  id: my_ble_tracker

    
debug:
  update_interval: 5s
 
sensor:
  - platform: debug
    free:
      name: "Free RAM"
      id: free_ram
      
text_sensor:
  - platform: ble_scanner
    name: "BLE Devices Scanner"
    on_value:
      then:
        - delay: 5s
        - if:
            condition:
              and:
                - not:
                    script.is_running: parse_text
                - lambda: 'return id(scanning_active);'
            then:
              - script.execute: 
                  id: parse_text
                  raw: !lambda 'return x;'
  - platform: template
    name: "RAM Display Updater"
    lambda: |-
      return "";
    on_value:
      then:
        - lvgl.label.update:
            id: ram_display
            text:
              format: "%.1f KB"
              args:
                - 'id(free_ram).state / 1024.0'

switch:
  - platform: lvgl
    id: switch_start
    name: "Toggle Switch"
    widget: btn_start
    on_turn_on:
      then:
        - delay: 100ms
        - logger.log: "Switch is on"
        - globals.set: 
            id: scanning_active
            value: 'true'
    on_turn_off:
      then:
        - logger.log: "Switch is off"
        - globals.set: 
            id: scanning_active
            value: 'false'
            
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a

spi:
  clk_pin: 12
  mosi_pin: 11
  miso_pin: 13
  
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: 14
    id: backlight_pwm

##########################################################################
display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    dc_pin: 4
    reset_pin: 5
    cs_pin: 10
    dimensions: 320x480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: ft63x6
    id: my_touch
    i2c_id: bus_a
    reset_pin: 6
    interrupt_pin: 7
    on_touch: 
      - light.turn_on: 
          id: backlight
          brightness: 100%    
############################################################################

lvgl:
  rotation: 90
  displays: 
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%
  bg_color: 0x48494B
  pages:
    - id: main_page
      widgets:
        - obj:
            x: 388
            width: 90
            pad_all: 2
            bg_color: 0x000000
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER 
            widgets:
              - label:
                  id: ram_display
                  width: 78
                  height: 40
                  text: "-- KB"
                  text_color: 0xFFFFFF
                  text_align: CENTER
              - button:
                  id: btn_start
                  width: 78
                  height: 30
                  on_click:
                    - delay: 50ms # Debounce button 
                    - logger.log: "Button was pressed!"
                    - switch.toggle: switch_start
                  widgets:
                    - label:
                        id: lbl_btn
                        text: "Update"
                        text_color: 0x000000
                        align: CENTER
        # Container to hold the list and handle scrolling
        - obj:
            id: ble_container
            width: 380
            height: 318
            pad_all: 0
            bg_color: 0xFFFFFF
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER 
            scrollbar_mode: ACTIVE
            widgets:
              # Header
              - obj:
                  width: 100%
                  height: 45
                  bg_color: 0x48494B
                  border_width: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        text: "BLE DEVICES"
                        align: CENTER
                        text_font: montserrat_20
                        text_color: 0xFFFF00

