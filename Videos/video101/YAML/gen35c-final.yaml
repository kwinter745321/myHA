# Installation method: Home Assistant OS
# Core: 2026.7.4
# Supervisor: 2026.07.5
# Operating System: 18.2
# Frontend: 220260624.6
# ESPHome Current version: 2026.7.3
#

# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

# https://community.home-assistant.io/t/help-making-esp32-3248s035-work/748332/7
# https://github.com/Bodmer/TFT_eSPI/issues/3323
# https://community.home-assistant.io/t/help-making-esp32-3248s035-work/748332/16


esphome:
  name: gen35c
  friendly_name: gen35c

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger: 
  level: DEBUG

api:
  encryption:
    key: !secret gen35_api  

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.68.123
  manual_ip: 
    static_ip: 192.168.68.123
    gateway: 192.168.68.1
    subnet: 255.255.255.0
  ap:
    ssid: !secret gen35_ap_ssid  
    password: !secret gen35_ap_pwd 

web_server:
    
captive_portal:
  
#########################################################
i2c:
  sda: 33
  scl: 32
  scan: true
  id: bus_a

spi:
  clk_pin: 14
  mosi_pin: 13
  miso_pin: 
    number: 12
    ignore_strapping_warning: true

light:
  - platform: rgb
    name: "Status Light"
    id: status_light
    red: red_GPIO
    green: green_GPIO
    blue: blue_GPIO
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: 4
    id: red_GPIO
    inverted: True
  - platform: ledc
    pin: 16
    id: green_GPIO
    inverted: True
  - platform: ledc
    pin: 17
    id: blue_GPIO
    inverted: True
  - platform: ledc
    pin: 27
    id: backlight_pwm

sensor:
  - platform: adc
    pin: GPIO34
    name: "Room Brightness"
    update_interval: 60s
    unit_of_measurement: "%"
    device_class: "illuminance"

#####################################################################
display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    dc_pin: 
      number: 2
      ignore_strapping_warning: true
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dimensions: 320x480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  platform: gt911
  id: my_touch
  update_interval: 50ms
#  interrupt_pin: 21 # maybe not connected?
#  reset_pin: 25 # From a openhasp config, appears to be the 'normal' esp32 reset pin?
  on_touch: 
    - light.turn_on: 
        id: backlight
        brightness: 100%
  on_release:
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

#################################################################

lvgl:
  rotation: 90
  touchscreens:
    - my_touch
  buffer_size: 25%
  on_idle:
    timeout: 600s
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  theme:
    label:
      text_font: montserrat_24
    button:
      # bg_color: 0x7DE546
