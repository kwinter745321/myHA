#   #   subnet: 255.255.255.0
#   band_mode: 5GHZ
  # ap:
  #   ssid: !secret smartc5_ap_ssid
  #   password: !secret smartc5_ap_pwd

# web_server:

# captive_portal:

#### NETWORK, OPENTHREAD, AND SWITCH ##############################################

network:
  enable_ipv6: true

openthread:
  device_type: FTD
  channel: 15
  network_name: "ha-thread-25cb"
  tlv: "0e0800000000000"  #replace with your string

switch:
  - platform: homeassistant
    name: "Smart Plug1"
    id: plug1
    icon: "mdi:restart"
    entity_id: "switch.mini_smart_wi_fi_plug"

#### SPI AND BOARD/DISPLAY LIGHTS ####################################################

spi:
  clk_pin: 6
  mosi_pin:
    number: 7
    ignore_strapping_warning: true
  miso_pin: 
    number: 2
    ignore_strapping_warning: true
  
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: esp32_rmt_led_strip
    id: led_status
    pin: 8
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB
    
output:
  - platform: ledc
    pin:    
      number: 9
    id: backlight_pwm

    
#### DISPLAY/TOUCH ######################################################################

display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    dc_pin: 1
    reset_pin: 0
    cs_pin: 10
    dimensions: 320x480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: 24  
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: false
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

#### FONT ########################################################################

font:
    #
    #  This font is acquired directly from google
    #
  - file: "gfonts://Roboto"
    id: roboto
    size: 50
    bpp: 4
  #
  #  Note:  This file must reside on the Home Assistant system in a folder within esphome
  #         See our GitHub site.
  #
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi
    size: 40
    bpp: 4
    glyphs: [
    "\U000F0335", # mdi-lightbulb
    "\U000F0336", # mdi-lightbulb-outline
    "\U000F0210", # mdi-fan
    "\U000F081D", # mdi-fan-off
    "\U000F05A9", # mdi-wifi
    "\U000F0B0B", # mdi-alpha-d-box
    "\U000F0BF4", # mdi-alpha-d-box-outline  
    ]

#### LVGL ########################################################################

lvgl:
  rotation: 90
  displays: 
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%
  bg_color: 0x48494B
  pages:
    - id: canvas_1
      bg_color: 0x111827
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: panel
            x: 0
            y: 0
            width: 480
            height: 320
            bg_color: 0x000000
            border_width: 0
            border_color: 0xE0E0E0
            pad_all: 0
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 50
            widgets:
              - button:
                  id: btn_fan
                  x: 40
                  y: 50
                  width: 100
                  height: 200
                  bg_color: 0xA5B0C0
                  bg_opa: 50%
                  text_color: 0x000000
                  text_font: montserrat_20
                  checkable: true
                  on_click:
                    - homeassistant.service:
                        service: switch.toggle
                        data:
                          entity_id: switch.mini_smart_wi_fi_plug
                  widgets:
                    - label:
                        id: lv_label_0
                        x: 0
                        y: 0
                        align: CENTER
                        text: "Fan"
                        text_color: 0x000000
                    - label:
                        id: lv_label_1
                        x: 15
                        y: 20
                        align: TOP_LEFT
                        text: "\U000F0210"
                        text_font: mdi
                        text_color: 0x000000
              - button:
                  id: btn_room
                  x: 190
                  y: 50
                  width: 100
                  height: 200
                  bg_color: 0xA5B0C0
                  bg_opa: 50%
                  text_color: 0x000000
                  text_font: montserrat_20
                  checkable: true
                  widgets:
                    - label:
                        id: lv_label_2
                        x: 0
                        y: 0
                        align: CENTER
                        text: "Room\nLight"
                        text_color: 0x000000
                    - label:
                        id: lv_label_3
                        x: 15
                        y: 20
                        align: TOP_LEFT
                        text: "\U000F0335"
                        text_font: mdi
                        text_color: 0x000000
              - button:
                  id: btn_light
                  x: 340
                  y: 50
                  width: 100
                  height: 200
                  bg_color: 0xA5B0C0
                  bg_opa: 50%
                  text_color: 0xFFFFFF
                  text_font: montserrat_20
                  checkable: true
                  widgets:
                    - label:
                        id: lv_label_4
                        x: 0
                        y: 0
                        align: CENTER
                        text: "Desk\nLight"
                        text_color: 0x000000
                    - label:
                        id: lv_label_5
                        x: 15
                        y: 20
                        align: TOP_LEFT
                        text: "\U000F0335"
                        text_font: mdi
                        text_color: 0x000000