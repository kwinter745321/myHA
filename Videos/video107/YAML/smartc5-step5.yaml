# Installation method: Home Assistant OS
# Core: 2026.9.2
# Supervisor: 2026.09.0
# Operating System: 18.2
# Frontend: 20260826.7
# ESPHome Current version: 2026.8.2
#
 Board: Generic ESP32-C5 Board (Generic)
# Definition: definitions/boards/generic-esp32c5/manifest.yaml

esphome:
  name: smartc5
  friendly_name: smartc5
  on_boot:
    then:
      - output.turn_off: backlight_pwm
      - delay: 30s
      - output.turn_on: backlight_pwm
        
esp32:
  variant: esp32c5
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_48: "y"

psram:
  mode: quad 

logger:

api:
  encryption:
    key: !secret smartc5_api

ota:
  - platform: esphome

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#   #use_address: 192.168.68.126
#   # manual_ip: 
#   #   static_ip: 192.168.68.126
