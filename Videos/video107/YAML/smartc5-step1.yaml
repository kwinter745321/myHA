# Installation method: Home Assistant OS
# Core: 2026.9.2
# Supervisor: 2026.09.0
# Operating System: 18.2
# Frontend: 20260826.7
# ESPHome Current version: 2026.8.2
#
# Board: Generic ESP32-C5 Board (Generic)
# Definition: definitions/boards/generic-esp32c5/manifest.yaml

esphome:
  name: smartc5
  friendly_name: smartc5
  on_boot:
    then:
      - output.turn_off: backlight_pwm
      - delay: 30s
      - output.turn_on: backlight_pwm
        
esp32:
  variant: esp32c5
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_48: "y"

psram:
  mode: quad 

logger:

api:
  encryption:
    key: !secret smartc5_api

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #use_address: 192.168.68.126
  manual_ip: 
    static_ip: 192.168.68.126
    gateway: 192.168.68.1
    subnet: 255.255.255.0
  ap:
    ssid: !secret smartc5_ap_ssid
    password: !secret smartc5_ap_pwd

web_server:

captive_portal:

#### NETWORK, OPENTHREAD, AND SWITCH ##############################################



#### SPI AND BOARD/DISPLAY LIGHTS ######################################

spi:
  clk_pin: 6
  mosi_pin:
    number: 7
    ignore_strapping_warning: true
  miso_pin: 
    number: 2
    ignore_strapping_warning: true
  
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: esp32_rmt_led_strip
    id: led_status
    pin: 8
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB
    
output:
  - platform: ledc
    pin:    
      number: 9
    id: backlight_pwm

    
#### DISPLAY/TOUCH ###########################################################

display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    dc_pin: 1
    reset_pin: 0
    cs_pin: 10
    dimensions: 320x480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: 24  
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: false
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

#### FONT ########################################################################


#### LVGL ########################################################################

lvgl:
  rotation: 90
  displays: 
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%
