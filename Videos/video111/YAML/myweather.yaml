            id: ui_label1
            long_mode: WRAP
            text: "My Weather"
            width: 480
            height: 50
            text_color: 0x1F51FF
            text_font: montserrat_36
            text_align: CENTER
        - obj:
            id: ui_cont
            width: 480
            height: 260
            y: 60
            layout:
              type: GRID
              grid_columns:
                - 150
                - 250
              grid_rows:
                - 50
                - 50
                - 100
            bg_opa: 0%
            border_width: 1
            pad_top: 0
            pad_bottom: 0
            pad_left: 0
            pad_right: 0
            border_color: 0x1F51FF
            widgets:
              - label:
                  id: ui_curr_temp
                  long_mode: WRAP
                  text: "--- *F"
                  width: 134
                  height: 49
                  x: 1
                  y: 26
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  text_color: 0x39FF14
                  text_font: montserrat_36
              - label:
                  id: ui_curr_humd
