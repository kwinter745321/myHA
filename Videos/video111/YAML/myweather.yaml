# Installation method: Home Assistant OS
# Core: 2026.10.1
# Supervisor: 2026.10.2
# Operating System: 18.3
# Frontend: 20260930.3
# ESPHome: 2026.9.1

# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: myweather
  friendly_name: myweather

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret myweather_api

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.68.128
  manual_ip: 
    static_ip: 192.168.68.128
    gateway: 192.168.68.1
    subnet: 255.255.255.0
  ap:
    ssid: !secret myweather_ap_ssid
    password: !secret myweather_ap_pwd

web_server:
    
captive_portal:

spi:
  - id: spi_display
    clk_pin: 12
    mosi_pin: 11
    miso_pin: 13

display:
  - id: panel
    platform: mipi_spi
    model: ST7796
    spi_id: spi_display
    cs_pin: 10
    dc_pin: 5
    reset_pin: 4
    dimensions:
      width: 320
      height: 480
    color_order: bgr
    data_rate: 40MHz
    spi_mode: MODE0
    auto_clear_enabled: false

touchscreen:
  - id: touch
    platform: xpt2046
    display: panel
    spi_id: spi_display
    cs_pin: 7
    interrupt_pin: 15
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: false
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 300
      y_max: 3800

##########################################################################################################################

time:
  platform: homeassistant

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s    
    on_value:
      then:
        - lvgl.label.update: 
            id: ui_lbl_wifi
            text:
              format: "%.0f dBm"
              args: [x]
  - platform: homeassistant
    name: "Current Temperature"
    id: current_temperature
    entity_id: weather.forecast_home
    attribute:  temperature
    internal: True
    unit_of_measurement: "°F"
    on_value: 
      then:
        - lvgl.label.update: 
            id: ui_curr_temp
            text: 
              format: "%.0f °F"
              args: ['id(current_temperature).state']
  - platform: homeassistant
    name: "Current Temperature"
    id: current_humidity
    entity_id: weather.forecast_home
    attribute:  humidity
    internal: True
    unit_of_measurement: "%"
    on_value: 
      then:
        - lvgl.label.update: 
            id: ui_curr_humd
            text: 
              format: "%.1f %%"
              args: ['id(current_humidity).state']

              
sun:
  latitude: 39.69
  longitude: 75.75

              
text_sensor:
  - platform: homeassistant
    id: current_condition
    entity_id: weather.forecast_home
    internal: True
    on_value:
      then:
        - lvgl.label.update:
            id: ui_curr_word
            #text: ! lambda |- return x;
            text:
              format: "%s"
              args: [id(current_condition).state.c_str()]
        - lvgl.label.update: 
            id: ui_curr_big
            text: !lambda |-
              if (id(current_condition).state == "sunny") return "\U000F0599";
              else if (id(current_condition).state == "clear-night") return "\U000F0594";
              else if (id(current_condition).state == "cloudy") return "\U000F0590"; 
              else if (id(current_condition).state == "exceptional") return "\U000F0F2F";
              else if (id(current_condition).state == "fog") return "\U000F0591";
              else if (id(current_condition).state == "hail") return "\U000F0592";
              else if (id(current_condition).state == "lightning") return "\U000F0593";
              else if (id(current_condition).state == "lightning-rainy") return "\U000F067E";
              else if (id(current_condition).state == "partlycloudy") return "\U000F0595";
              else if (id(current_condition).state == "pouring") return "\U000F0596";
              else if (id(current_condition).state == "rainy") return "\U000F0597";
              else if (id(current_condition).state == "snowy") return "\U000F0598";
              else if (id(current_condition).state == "snowy-rainy") return "\U000F067F";
              else if (id(current_condition).state == "windy") return "\U000F059D";
              else if (id(current_condition).state == "windy-variant") return "\U000F059E";
              else if (id(current_condition).state == "sunny-off") return "\U000F14E4";
              else return "\U0000F0599";
        - lvgl.label.update:
            id: ui_curr_big
            text_color: !lambda |-
              if (id(current_condition).state == "sunny") return lv_color_hex(0xFFFF00); 
              else if (id(current_condition).state == "lightning-rainy") return lv_color_hex(0x0000FF);
              else if (id(current_condition).state == "rainy") return lv_color_hex(0x00FFFF);
              else return lv_color_hex(0xFFFFFF);

  - platform: sun
    name: Sun Next Sunrise
    id: sunrise
    type: sunrise
    on_value:
      then:
        - lvgl.label.update: 
            id: ui_lbl_sunrise
            text: !lambda |-
              struct tm dt = {};
              strptime(id(sunrise).state.c_str(), "%X", &dt);
              char buffer[20];
              strftime(buffer, sizeof(buffer), "Sunrise: %X", &dt);
              return {std::string(buffer)};
  - platform: sun
    name: Sun Next Sunset
    id: sunset
    type: sunset
    on_value:
      then:
        - lvgl.label.update: 
            id: ui_lbl_sunset
            text: !lambda |-
              struct tm dt = {};
              strptime(id(sunset).state.c_str(), "%X", &dt);
              char buffer[20];
              strftime(buffer, sizeof(buffer), "Sunset: %X", &dt);
              return {std::string(buffer)};


############################################################################################################################

font:
  # Material Design Icons 7.4.47 at 32 px. ESPHome fetches the font itself.
  - id: mdi_32
    file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 32
    bpp: 4
    glyphs:
      - "\U000F05A9"  # wifi
  # Material Design Icons 7.4.47 at 48 px. ESPHome fetches the font itself.
  - id: mdi_48
    file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 48
    bpp: 4
    glyphs:
      # Added to the font by name: no widget draws these. For a label whose text a lambda sets (README).
      - "\U000F0590"  # weather-cloudy
      - "\U000F0F2F"  # weather-cloudy-alert
      - "\U000F0591"  # weather-fog
      - "\U000F0592"  # weather-hail
      - "\U000F0593"  # weather-lightning
      - "\U000F0594"  # weather-night
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0596"  # weather-pouring
      - "\U000F0597"  # weather-rainy
      - "\U000F0598"  # weather-snowy
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0599"  # weather-sunny
      - "\U000F14E4"  # weather-sunny-off
      - "\U000F059D"  # weather-windy
      - "\U000F059E"  # weather-windy-variant

output:
  - platform: ledc
    id: backlight_output
    pin: 6
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON

lvgl:
  displays:
    - panel
  touchscreens:
    - touch
  rotation: 90
  default_font: montserrat_14
  buffer_size: 25%
